# SubTask 5: Test configurable fps_adapter_gate_init (default -2.0)
# Copy from test_subtask4.toml and change fps_adapter_gate_init

[model]
model_type = "t2v"
dim = 5120
num_layers = 42
num_heads = 16
in_dim = 16
out_dim = 16
text_len = 512
text_dim = 4096
ffn_dim = 8192
fps_adapter_rank = 32
fps_adapter_gate_init = -2.0                        # SubTask 5: Changed from 0.0 to -2.0
fps_condition_blocks = "deepest_third"
fps_adapter_num_tokens = 4
fps_tau_transform = "log1p"
fps_tau_scale = 0.33333334
fps_embed_dim = 256
fps_condition_hidden = 64

[training]
num_epochs = 1
warmup_steps = 0
learning_rate = 2e-5
save_every_n_steps = 15
save_dir = "checkpoints/low_magnitude"
max_steps = 15

[dataset]
path = "datatset/dummy"
batch_size = 1
resolution = [800, 512]
frames = 33

[adapter]
type = 'fps_only'